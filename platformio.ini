[platformio]
default_envs = cardputer_adv, cardputer

[env]
platform = espressif32@6.13.0
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions-build-only.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 1572864
lib_deps =
    https://github.com/m5stack/M5Cardputer/archive/2d4fa6646e4e5b47e0af96214b003aa7b15b8d81.zip
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    z3t0/IRremote@4.7.1
build_unflags = -std=gnu++11 -fexceptions
build_flags =
    -std=gnu++17
    -Os
    -flto
    -fno-exceptions
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DRADAR_COUNTRY=\"PL\"
    -Wall
    -Wextra
monitor_speed = 115200
extra_scripts =
    pre:scripts/optimize_build.py
    post:scripts/package_firmware.py
upload_protocol = custom
upload_command = python3 scripts/refuse_upload.py

[env:cardputer_adv]
build_flags = ${env.build_flags} -DRADAR_ADV=1

[env:cardputer]
build_flags = ${env.build_flags} -DRADAR_ADV=0

[env:cardputer_adv_probe]
build_flags = ${env.build_flags} -DRADAR_ADV=1 -DRADAR_WPS_PROBE=1

[env:cardputer_probe]
build_flags = ${env.build_flags} -DRADAR_ADV=0 -DRADAR_WPS_PROBE=1
